      <rect x="976" y="384" width="32" height="32" rx="10" fill="#F4F2EE"/><text x="992" y="406" fill="#6E706B">8</text>
      <rect x="1013" y="384" width="32" height="32" rx="10" fill="#F4F2EE"/><text x="1029" y="406" fill="#6E706B">9</text>
      <rect x="1050" y="384" width="32" height="32" rx="10" fill="#DCE6D8"/><text x="1066" y="406" fill="#4A6741">10</text>
