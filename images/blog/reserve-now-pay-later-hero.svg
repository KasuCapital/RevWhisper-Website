      <rect x="1124" y="384" width="32" height="32" rx="10" fill="#EDF5E9"/><text x="1140" y="406" fill="#4A6741">12</text>
      <rect x="1161" y="384" width="32" height="32" rx="10" fill="#EDF5E9"/><text x="1177" y="406" fill="#4A6741">13</text>

      <rect x="976" y="427" width="32" height="32" rx="10" fill="#F4F2EE"/><text x="992" y="449" fill="#6E706B">15</text>
      <rect x="1013" y="427" width="32" height="32" rx="10" fill="#DCE6D8"/><text x="1029" y="449" fill="#4A6741">16</text>
      <rect x="1050" y="427" width="32" height="32" rx="10" fill="#DCE6D8"/><text x="1066" y="449" fill="#4A6741">17</text>
      <rect x="1087" y="427" width="32" height="32" rx="10" fill="#DCE6D8"/><text x="1103" y="449" fill="#4A6741">18</text>
      <rect x="1124" y="427" width="32" height="32" rx="10" fill="#EDF5E9"/><text x="1140" y="449" fill="#4A6741">19</text>
      <rect x="1161" y="427" width="32" height="32" rx="10" fill="#F4F2EE"/><text x="1177" y="449" fill="#6E706B">20</text>

      <rect x="976" y="470" width="32" height="32" rx="10" fill="#F4F2EE"/><text x="992" y="492" fill="#6E706B">22</text>
      <rect x="1013" y="470" width="32" height="32" rx="10" fill="#F4F2EE"/><text x="1029" y="492" fill="#6E706B">23</text>
      <rect x="1050" y="470" width="32" height="32" rx="10" fill="#F4F2EE"/><text x="1066" y="492" fill="#6E706B">24</text>
      <rect x="1087" y="470" width="32" height="32" rx="10" fill="#DCE6D8"/><text x="1103" y="492" fill="#4A6741">25</text>
      <rect x="1124" y="470" width="32" height="32" rx="10" fill="#DCE6D8"/><text x="1140" y="492" fill="#4A6741">26</text>
      <rect x="1161" y="470" width="32" height="32" rx="10" fill="#EDF5E9"/><text x="1177" y="492" fill="#4A6741">27</text>
    </g>

    <path d="M984 535C1038 524 1055 468 1110 463C1152 459 1170 486 1198 486" stroke="#4A6741" stroke-width="6" stroke-linecap="round"/>
    <circle cx="1110" cy="463" r="7" fill="#4A6741"/>
    <text x="985" y="553" fill="#5A5A57" font-family="DM Sans, Arial, sans-serif" font-size="20">earlier bookings are stacking up</text>
  </g>

  <g>
    <rect x="1026" y="102" width="198" height="92" rx="26" fill="#32302F"/>
    <text x="1125" y="138" text-anchor="middle" fill="#D8E6D2" font-family="DM Mono, monospace" font-size="16">HOST REVENUE NOTE</text>
    <text x="1125" y="174" text-anchor="middle" fill="#FFFFFF" font-family="DM Sans, Arial, sans-serif" font-size="24" font-weight="700">Price 60-120 days out</text>
  </g>
