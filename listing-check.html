<!-- Attribution capture (cookie-free): a lead carries its UTMs and ad click IDs into the CRM.
     One copy for every page. Edit _partials/attribution.html, then run node scripts/sync-partials.mjs. -->
<script>
(function(){
  var key='rw_attribution';
  var TTL=7776000000; // 90 days — keep the last paid touch across tabs/sessions
  var params=new URLSearchParams(window.location.search);
  var utmFields=['utm_source','utm_medium','utm_campaign','utm_term','utm_content','utm_id'];
  // gbraid/wbraid: Google's iOS click IDs, sent in place of gclid. Keep in sync with CLICK_IDS in /assets/rw-consent.js.
  var clickFields=['fbclid','gclid','gbraid','wbraid','ttclid','twclid','msclkid','li_fat_id'];
  var trackedFields=utmFields.concat(clickFields);
  // A page sets window.rwAttributionForce before this runs when every visit must be recorded (/vrma does).
  var hasTracked=!!window.rwAttributionForce||trackedFields.some(function(f){return params.has(f);});
  function rwGet(k){try{return localStorage.getItem(k)||sessionStorage.getItem(k);}catch(e){try{return sessionStorage.getItem(k);}catch(e2){return null;}}}
  function rwSet(k,v){try{localStorage.setItem(k,v);}catch(e){try{sessionStorage.setItem(k,v);}catch(e2){}}}
  var prev=null;try{prev=JSON.parse(rwGet(key));}catch(e){prev=null;}
  var fresh=prev&&prev.arrived_at&&((Date.now()-new Date(prev.arrived_at).getTime())<TTL);
  if(hasTracked||!fresh){
    var data={};
    trackedFields.forEach(function(f){if(params.get(f))data[f]=params.get(f);});
    try{data.referrer=document.referrer?new URL(document.referrer).hostname:'direct';}catch(e){data.referrer=document.referrer||'direct';}
    data.landing_page=window.location.pathname;
    data.arrived_at=new Date().toISOString();
    rwSet(key,JSON.stringify(data));
    prev=data;
  }
  // This page's copy, kept in memory. Facebook's and Instagram's in-app browsers can lose storage
  // while the page is still open (the visitor switches apps to copy their Airbnb link, comes back,
  // submits), which sent those leads to the CRM with no UTMs at all.
  var atLoad=prev||{};

  // One label for where the lead came from, filled in even when the link carried no UTMs.
  function channel(a){
    var s=String(a.utm_source||'').toLowerCase(), m=String(a.utm_medium||'').toLowerCase();
    var r=String(a.referrer||'').toLowerCase();
    var paid=/cpc|ppc|paid|display|retarget|^ads?$/.test(m);
    if(/^(meta|facebook|fb|instagram|ig|threads)$/.test(s))return paid?'meta-ads':'meta-organic';
    if(a.gclid||a.gbraid||a.wbraid||(/google/.test(s)&&paid))return 'google-ads';
    if(a.msclkid||(/bing|microsoft/.test(s)&&paid))return 'microsoft-ads';
    // Meta adds fbclid to every Facebook/Instagram link. Without UTMs it's an ad click whose URL
    // parameters didn't come through, or an organic post or message.
    if(a.fbclid)return 'meta';
    if(a.twclid||/^(x|twitter)$/.test(s))return 'x';
    if(a.ttclid||s==='tiktok')return 'tiktok';
    if(a.li_fat_id||s==='linkedin')return 'linkedin';
    if(s)return s; // any other tagged link: email, partner, conference...
    if(!r||r==='direct')return 'direct';
    if(/(^|\.)revwhisper\.com$/.test(r))return 'unknown'; // record started mid-visit, the entry point wasn't seen
    if(/(^|\.)(google|bing|duckduckgo|yahoo|ecosia|brave|baidu|yandex)\.[a-z.]+$/.test(r))return 'organic-search';
    if(/(^|\.)(facebook|instagram|threads|linkedin|reddit|youtube|tiktok|pinterest|twitter|x)\.(com|net)$|^(t\.co|lnkd\.in)$/.test(r))return 'social';
    return 'referral';
  }

  // What every form sends as `attribution`: the stored record, or this page's in-memory copy when
  // storage was lost, plus `channel`.
  window.rwAttribution=function(){
    var a=null;
    try{a=JSON.parse(localStorage.getItem(key));}catch(e){}
    if(!a||!a.arrived_at){try{a=JSON.parse(sessionStorage.getItem(key));}catch(e){}}
    if(!a||!a.arrived_at)a=atLoad;
    var out={};
    for(var k in a){if(Object.prototype.hasOwnProperty.call(a,k))out[k]=a[k];}
    out.channel=channel(out);
    // Opt-in regions without ad consent: no click IDs leave the browser (same rule as /assets/rw-consent.js).
    if(window.rwConsent&&rwConsent.optIn&&!rwConsent.ads)clickFields.forEach(function(f){delete out[f];});
    return out;
  };
})();
</script>
<!-- ATTRIBUTION:END -->

<title>Your Listing Check | RevWhisper</title>
<!-- Where a disqualified /audit lead goes after the contact form: ten short strategy videos, a score,
     their live listing report (RevWhisper Growth Hub, read through /api/listing-report) and the onboarding
     offer, which hands off to /checkout-form. Not linked yet: the live forms still send unqualified leads to
     /audit-report-coming. Reads the lead from sessionStorage.rw_audit_lead (set by the /audit forms), or
     from ?name=&email=&listing= when opened directly. ?review=1 adds a screen picker; ?review=1&report=<id>
     loads any finished Growth Hub report. Tracking: GA4 + PostHog events (listing_check_*), Meta
     ListingCheckStart / ListingCheckComplete, all behind rw-consent. -->
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/icons/favicon-light.svg" type="image/svg+xml">

<link rel="preload" href="/fonts/lora-italic-400-700.woff2" as="font" type="font/woff2" crossorigin>

<style>
@font-face{font-family:'Lora';font-style:normal;font-weight:400 700;font-display:swap;src:url(/fonts/lora-normal-400-700.woff2) format('woff2')}
@font-face{font-family:'Lora';font-style:italic;font-weight:400 700;font-display:swap;src:url(/fonts/lora-italic-400-700.woff2) format('woff2')}
@font-face{font-family:'DM Sans';font-style:normal;font-weight:300 700;font-display:swap;src:url(/fonts/dm-sans-normal-300-700.woff2) format('woff2')}
@font-face{font-family:'DM Mono';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/dm-mono-400.woff2) format('woff2')}
@font-face{font-family:'DM Mono';font-style:normal;font-weight:500;font-display:swap;src:url(/fonts/dm-mono-500.woff2) format('woff2')}

/* ── /listing-check ───────────────────────────────────────────────────────────
   One page, two skins, so it continues whichever form the visitor just finished:
   phones get the /audit-flow look (white app, sage wash, round back button, dark
   segmented progress, 16px chips that fill Dune when picked, Dune CTA); 720px and up
   gets the /audit form-card look (sage backdrop, white card, uppercase green eyebrow,
   option cards that fill sage, green Continue, bordered Back). From 1000px the video
   screens split: video left, question card right, so nothing scrolls on a laptop.
   Screens change in two beats (old fades out, then the new one cascades in), so two
   questions are never on screen together and nothing visible moves. */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --black:#32302F;--accent:#4A6741;--accent-dark:#3C5535;--accent-light:#dce6d8;--accent-border:#b3c5ab;--accent-wash:#eef3ec;
  --terra:#8B4A3E;--terra-wash:#f6ecea;--terra-line:#e3c9c3;--gold:#9B7B3A;--gold-wash:#f5efe2;--gold-line:#e6d9b8;--red:#B85252;
  --g50:#faf9f8;--g100:#f3f1ef;--g200:#E0DCDA;--g300:#ccc8c5;--g400:#a39e9b;--g500:#706b68;--g600:#58534f;
  --line:rgba(50,48,47,.11);
  --heading:'Lora','Georgia',serif;--body:'DM Sans',system-ui,'Helvetica Neue',sans-serif;--mono:'DM Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --silk:cubic-bezier(.16,1,.3,1);--silk-out:cubic-bezier(.4,0,1,1);--back:cubic-bezier(.34,1.56,.64,1);
  --sh-chip:0 1px 2px rgba(50,48,47,.04),0 1px 1px rgba(50,48,47,.02);
  --sh-card:0 1px 2px rgba(50,48,47,.06),0 14px 30px -10px rgba(50,48,47,.22);
  --sh:0 4px 16px rgba(50,48,47,.07),0 2px 6px rgba(50,48,47,.04);
  --sh-lg:0 16px 48px rgba(50,48,47,.1),0 4px 12px rgba(50,48,47,.05);
  --bar-h:60px;
}
html{-webkit-text-size-adjust:100%;scrollbar-gutter:stable}  /* a scrollbar appearing mid-screen must not shift the layout */
body{font-family:var(--body);color:var(--black);background:#fff;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;min-height:100vh;overflow-x:hidden}
/* soft sage wash at the top, as on /audit-flow */
body::before{content:"";position:fixed;left:0;right:0;top:0;height:60vh;z-index:-1;pointer-events:none;
  background:linear-gradient(180deg,#f1f5ee 0%,rgba(241,245,238,.6) 50%,rgba(255,255,255,0) 100%)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
img,video{display:block;max-width:100%}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[data-focus]:focus{outline:none}

/* ── top bar: back (or the mark) + segmented progress, one segment per strategy ── */
.bar{position:sticky;top:0;z-index:40;padding-top:env(safe-area-inset-top,0px);transition:background-color .25s,box-shadow .25s}
body.scrolled .bar{background:rgba(255,255,255,.9);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);box-shadow:0 1px 0 var(--line)}
.bar-in{display:flex;align-items:center;gap:12px;height:var(--bar-h);padding:0 18px;max-width:1300px;margin:0 auto}
.back{width:36px;height:36px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(50,48,47,.08),0 0 0 1px var(--line);display:grid;place-items:center;flex:0 0 auto}
.back svg{width:16px;height:16px}
.back[hidden]{display:none}
.brand{display:flex;align-items:center;gap:9px;flex:0 0 auto}
.brand .lm{width:36px;height:36px;display:grid;place-items:center;color:var(--accent)}
.brand .lm svg{width:26px;height:26px}
.brand .ln{display:none;font-family:var(--heading);font-size:19px;letter-spacing:-.015em}
.back:not([hidden]) + .brand{display:none}
.segs{flex:1;display:flex;gap:5px;transition:opacity .3s var(--silk)}
.segs.off{opacity:0}
.seg{flex:1;height:3px;border-radius:3px;background:rgba(50,48,47,.1);overflow:hidden}
.seg i{display:block;height:100%;background:var(--black);border-radius:3px;transform:scaleX(0);transform-origin:left;transition:transform .5s var(--silk)}
.seg.on i{transform:scaleX(1)}
.rchip{display:none}

/* ── screens ── */
.stage{padding:10px 20px calc(env(safe-area-inset-bottom,0px) + 36px)}
.scr{width:100%;max-width:560px;margin:0 auto}
.scr.out{opacity:0;transform:translate3d(0,-8px,0);transition:opacity .16s var(--silk-out),transform .18s var(--silk-out);pointer-events:none}
.scr.rev.out{transform:translate3d(0,8px,0)}
@keyframes rise{from{opacity:0;transform:translate3d(0,12px,0)}to{opacity:1;transform:none}}
@keyframes riseDown{from{opacity:0;transform:translate3d(0,-12px,0)}to{opacity:1;transform:none}}
.scr.in .rv{animation:rise .46s var(--silk) both}
.scr.in.rev .rv{animation-name:riseDown}
.split{display:flex;flex-direction:column;gap:22px}
.col{min-width:0}

/* ── video ── */
.media{min-width:0}
.frame{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#fff;box-shadow:var(--sh-card);isolation:isolate;cursor:pointer;-webkit-mask-image:-webkit-radial-gradient(white,black)}
.media.cream .frame{background:#f9f7f5}
.frame video{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;background:transparent}
.frame::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;border-radius:inherit;box-shadow:inset 0 0 0 1px var(--line);pointer-events:none;z-index:4}
/* a soft veil while it's paused or finished, so the button reads */
.frame::before{content:"";position:absolute;top:0;right:0;bottom:0;left:0;z-index:1;background:rgba(255,255,255,.42);opacity:0;transition:opacity .3s var(--silk);pointer-events:none}
.media[data-state=paused] .frame::before,.media[data-state=ended] .frame::before,.media[data-state=idle] .frame::before{opacity:1}
.vprog{position:absolute;left:0;right:0;bottom:0;height:3px;z-index:3;background:rgba(50,48,47,.06)}
.vprog i{display:block;height:100%;background:var(--accent);transform:scaleX(0);transform-origin:left}
.vbig,.vsound,.verr{position:absolute;z-index:2;opacity:0;pointer-events:none;transition:opacity .25s var(--silk),transform .25s var(--silk)}
.vbig{left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 8px 22px rgba(74,103,65,.3);transform:scale(.9)}
.vbig svg{width:24px;height:24px}
.vbig .ic-play{margin-left:3px}
.vbig .ic-replay{display:none}
.media[data-state=idle] .vbig,.media[data-state=paused] .vbig,.media[data-state=ended] .vbig{opacity:1;pointer-events:auto;transform:none}
.media[data-state=ended] .vbig .ic-play{display:none}
.media[data-state=ended] .vbig .ic-replay{display:block}
.vsound{top:8px;right:8px;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px 0 10px;border-radius:999px;background:rgba(50,48,47,.9);color:#fff;font-size:12.5px;font-weight:600;box-shadow:0 4px 14px rgba(50,48,47,.22);transform:translateY(-4px)}
.vsound svg{width:15px;height:15px}
@media(min-width:720px){.vsound{top:12px;right:12px;height:34px;padding:0 14px 0 11px;font-size:13px}.vsound svg{width:16px;height:16px}}
.media[data-state=muted] .vsound{opacity:1;pointer-events:auto;transform:none}
.verr{top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:var(--g50);font-size:15px;color:var(--terra);text-align:center;padding:16px}
.verr button{font-size:14px;font-weight:600;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.media[data-state=error] .verr{opacity:1;pointer-events:auto}
/* timed captions under the strategy videos (the other three have them burned in) */
.vcap{display:flex;justify-content:center;align-items:flex-start;min-height:58px;margin-top:12px;padding:0 4px}
.vcap span{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh-chip);padding:8px 14px;font-size:14.5px;font-weight:500;line-height:1.4;text-align:center;opacity:0;transform:translateY(3px);transition:opacity .15s ease,transform .2s var(--silk)}
.vcap span.on{opacity:1;transform:none}
.link{font-size:13.5px;font-weight:500;color:var(--accent);text-decoration:underline;text-underline-offset:3px;padding:6px 0}

/* ── phones: heading, then the video, then the question and the button ── */
.lead-m{text-align:left}
.lead-m .h,.op-head .h{text-wrap:pretty}   /* left-aligned titles fill the line; balance left them looking narrow */
.lead-m .h.t{font-size:clamp(25px,6.9vw,28px);line-height:1.16;letter-spacing:-.024em}
@media(max-width:719px){
  .lg-only{display:none!important}
  .split{gap:0}
  .split > * + *{margin-top:var(--sg,20px)}
  .qcard .lg-only + .lede,.qcard .lg-only + .steps{margin-top:0}
  .qcard .lchip{display:none}   /* first screen: the listing chip is desktop only, so the screen fits */
  .qcard .opts{margin-top:0}
  /* captions ride the video's lower edge, like the burned-in ones on the other videos, so no empty slot under it */
  .media{position:relative}
  .vcap{position:absolute;left:10px;right:10px;bottom:12px;min-height:0;margin:0;padding:0;z-index:3;pointer-events:none}
  .vcap span{font-size:12.5px;line-height:1.35;padding:6px 11px;border-radius:10px;box-shadow:0 2px 10px rgba(50,48,47,.14)}
}
@media(min-width:720px){.lead-m{display:none}}

/* ── the question card (phones: no card chrome, centred, as /audit-flow) ── */
.qcard{text-align:left}
.kick{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:500;color:var(--accent);margin-bottom:8px}
.kick svg{width:14px;height:14px;color:var(--accent);flex:0 0 auto}
.h{font-family:var(--heading);font-weight:400;font-size:clamp(30px,8.4vw,34px);line-height:1.1;letter-spacing:-.026em;text-wrap:balance}
.h em{font-style:italic;color:var(--accent)}
.h.q{font-size:clamp(21px,5.7vw,23px);line-height:1.3;letter-spacing:-.015em}
.lede{font-size:16px;line-height:1.55;color:var(--g500);margin-top:10px;text-wrap:pretty}

.opts{display:flex;flex-direction:column;gap:10px;margin-top:20px;text-align:left}
.opt{position:relative;display:block;cursor:pointer}
.opt input{position:absolute;opacity:0;pointer-events:none}
.ob{position:relative;display:flex;align-items:center;gap:12px;min-height:58px;padding:11px 16px 11px 18px;border-radius:16px;background:#fff;border:1px solid var(--line);box-shadow:var(--sh-chip);
  transition:background-color .2s var(--silk),border-color .2s var(--silk),color .2s var(--silk),transform .25s var(--silk),box-shadow .25s}
.ot{position:relative;flex:1;min-width:0}
.ot b{display:block;font-size:16px;font-weight:500;letter-spacing:-.005em;line-height:1.3}
.ot small{display:block;font-size:13.5px;line-height:1.35;color:var(--g500);margin-top:2px;transition:color .2s}
.od{position:relative;flex:0 0 auto;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--g300);transition:border-color .2s,background-color .2s,box-shadow .2s}
.opt:active .ob{background:var(--g50)}
.opt input:checked + .ob{background:var(--black);border-color:var(--black);color:#fff}
.opt input:checked + .ob small{color:rgba(255,255,255,.72)}
.opt input:checked + .ob .od{border-color:#fff;background:#fff;box-shadow:inset 0 0 0 5px var(--black)}
.opt input:focus-visible + .ob{outline:2px solid var(--accent);outline-offset:2px}
@media(hover:hover){.opt:hover .ob{border-color:var(--g300)}.opt input:checked + .ob{border-color:var(--black)}}

/* the optional note appears once an answer is picked (phones: no height animation) */
.note{display:grid;grid-template-rows:0fr;opacity:0;transform:translate3d(0,6px,0);transition:opacity .3s var(--silk),transform .3s var(--silk);text-align:left}
.note.on{grid-template-rows:1fr;opacity:1;transform:none}
.note-in{overflow:hidden;min-height:0;padding:0 3px 3px}
.nl{display:block;font-size:13px;font-weight:600;color:var(--g600);margin:18px 0 6px 2px}
.optl{font-weight:400;color:var(--g400);margin-left:4px}
.note textarea{display:block;width:100%;min-height:86px;resize:vertical;border-radius:16px;border:1px solid var(--line);background:#fff;padding:12px 14px;font-size:16px;line-height:1.45;box-shadow:var(--sh-chip);outline:none;transition:border-color .2s,box-shadow .2s;-webkit-appearance:none;appearance:none}
.note textarea::placeholder{color:var(--g400)}
.note textarea:focus{border-color:var(--black);box-shadow:0 0 0 3px rgba(50,48,47,.08)}

.acts{display:flex;gap:10px;margin-top:22px}
.cta{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:0 20px;border-radius:18px;background:var(--black);color:#fff;font-size:16px;font-weight:600;letter-spacing:-.005em;
  box-shadow:0 1px 2px rgba(50,48,47,.2),0 10px 24px -8px rgba(50,48,47,.45);transition:opacity .25s var(--silk),box-shadow .25s,transform .25s var(--back),background-color .2s}
.cta:active:not(:disabled){background:#45423f}
.cta:disabled{opacity:.3;box-shadow:none;cursor:not-allowed}
.cta svg{width:16px;height:16px;flex:0 0 auto}
.bk{display:none}

.lchip{display:flex;align-items:center;gap:12px;margin:16px 0 0;padding:10px 14px 10px 10px;border-radius:16px;background:#fff;border:1px solid var(--line);box-shadow:var(--sh-chip);text-align:left}
.lchip .tile{width:34px;height:34px;border-radius:10px;background:#FF385C;display:grid;place-items:center;flex:0 0 auto}
.lchip .tile svg{width:18px;height:18px;fill:#fff}
.lchip .lt{min-width:0}
.lchip b{display:block;font-size:13.5px;font-weight:600}
.lchip small{display:block;font-size:13px;color:var(--g500);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── score ── */
.panel{text-align:left}
.score{display:flex;align-items:baseline;gap:14px;margin:4px 0 18px}
.score .big{font-family:var(--mono);font-size:64px;line-height:1;color:var(--accent)}
.score .of{font-family:var(--heading);font-size:22px;letter-spacing:-.01em}
.meter{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin:0 0 22px}
.meter i{height:10px;border-radius:5px;background:var(--g200);transform:scaleX(0);transform-origin:left;animation:grow .45s var(--silk) forwards}
.meter i.yes{background:var(--accent)}.meter i.partly{background:var(--gold)}.meter i.no{background:var(--terra)}
@keyframes grow{to{transform:scaleX(1)}}
.tally{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;margin:0 0 22px}
.tally div{padding:14px 16px;border-right:1px solid var(--line)}
.tally div:last-child{border-right:0}
.tally b{display:block;font-family:var(--mono);font-weight:400;font-size:28px;line-height:1.15}
.tally span{font-size:14px;color:var(--g500)}
.body{font-size:16px;line-height:1.6;color:var(--g600)}
.h3{font-family:var(--heading);font-weight:400;font-size:22px;letter-spacing:-.01em;margin:26px 0 10px}
.gaps{list-style:none;border-top:1px solid var(--line)}
.gaps li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);font-size:16px;line-height:1.4}
.tag{flex:none;font-size:12.5px;font-weight:500;padding:3px 10px;border-radius:999px;border:1px solid var(--g200);color:var(--g500);background:#fff;white-space:nowrap}
.tag.no{border-color:var(--terra-line);color:var(--terra);background:var(--terra-wash)}
.tag.partly{border-color:var(--gold-line);color:var(--gold);background:var(--gold-wash)}

/* ── report ── */
.rload{border:1px solid var(--line);border-radius:16px;background:#fff;box-shadow:var(--sh-chip);padding:22px;margin-top:22px}
.rbar{height:6px;background:var(--g100);border-radius:3px;overflow:hidden}
.rbar b{display:block;height:100%;width:100%;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform 2.2s cubic-bezier(.4,0,.2,1)}
.rload ol{list-style:none;margin-top:16px}
.rload li{display:flex;align-items:center;gap:12px;padding:8px 0;color:var(--g500);font-size:16px;transition:color .3s}
.rload li.done{color:var(--black)}
.rload li i{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--g300);flex:none;display:grid;place-items:center;transition:background-color .3s,border-color .3s}
.rload li i svg{width:12px;height:12px;color:#fff;opacity:0;transition:opacity .2s}
.rload li.done i{background:var(--accent);border-color:var(--accent)}
.rload li.done i svg{opacity:1}
.hero{background:var(--black);color:#fff;border-radius:18px;padding:24px;margin:16px 0 18px}
.hero .lab{font-size:14px;color:#cfcac6}
.hero .big{font-family:var(--mono);font-size:clamp(40px,11vw,52px);line-height:1.1;margin:6px 0 2px}
.hero .sub{font-family:var(--heading);font-size:22px;margin-bottom:12px}
.hero p{font-size:16px;line-height:1.5;color:#d9d5d2}
.rsec{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh-chip);padding:18px;margin-bottom:14px}
.rsec h3{font-family:var(--heading);font-weight:400;font-size:22px;letter-spacing:-.01em;margin-bottom:6px}
.rsec .find{font-size:16px;line-height:1.55;color:var(--g600);margin-bottom:14px}
.ties{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.tie{font-size:12.5px;border:1px solid var(--g200);border-radius:999px;padding:3px 10px;color:var(--g500)}
.tie.no{border-color:var(--terra-line);color:var(--terra)}
.tie.partly{border-color:var(--gold-line);color:var(--gold)}
.tie.yes{border-color:var(--accent-border);color:var(--accent)}
.rtable{overflow-x:auto;border:1px solid var(--line);border-radius:12px;max-width:100%;-webkit-overflow-scrolling:touch}
.rtable table{border-collapse:collapse;width:100%;min-width:520px;font-size:14px}
.rtable th,.rtable td{padding:9px 6px;text-align:center;border-bottom:1px solid var(--line)}
.rtable thead th{font-weight:500;color:var(--g500);font-size:12.5px}
.rtable tbody th{text-align:left;font-weight:500;white-space:nowrap;padding-left:12px}
.rtable td{font-family:var(--mono);font-size:13.5px}
.rtable td.p1{background:var(--accent-wash);color:var(--accent)}
.rtable td.pn{background:var(--terra-wash);color:var(--terra)}
.rtable tr:last-child th,.rtable tr:last-child td{border-bottom:0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--g500);margin-top:8px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c);box-shadow:inset 0 0 0 1px var(--line)}
.cals{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.cal{border:1px solid var(--line);border-radius:12px;padding:10px}
.cal h4{font-size:14px;font-weight:600;margin-bottom:6px}
.cal .g{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .g span{aspect-ratio:1;border-radius:4px;font-family:var(--mono);font-size:10px;display:flex;align-items:center;justify-content:center;color:var(--g500)}
.cal .g .wd{font-family:var(--body);aspect-ratio:auto}
.cal .g .bk2{background:var(--g100);color:#b8b2ae}
.cal .g .op{background:var(--terra-wash);color:var(--terra);font-weight:500;box-shadow:inset 0 0 0 1px var(--terra-line)}
.cal .g .pa{opacity:.3}
/* first screen: what they're about to do */
.steps{list-style:none;display:grid;gap:10px;text-align:left}
.steps li{display:flex;gap:12px;align-items:flex-start}
.steps li > b{flex:0 0 auto;width:24px;height:24px;margin-top:1px;border-radius:50%;background:var(--accent-light);color:var(--accent);display:grid;place-items:center;font-family:var(--mono);font-size:12.5px;font-weight:500}
.steps strong{display:block;font-size:15.5px;font-weight:600;line-height:1.35}
.steps span{display:block;font-size:14px;line-height:1.45;color:var(--g500);margin-top:1px}
.qcard .lg-only + .steps{margin-top:18px}
/* the listing itself, from Growth Hub's scrape */
.lcard{display:flex;gap:14px;align-items:center;margin:4px 0 16px}
.lcard img{flex:0 0 auto;width:96px;height:72px;border-radius:12px;object-fit:cover;background:var(--g100);box-shadow:var(--sh-chip)}
.lcard > div{min-width:0}
.lcard .h{font-size:clamp(22px,6vw,26px);line-height:1.18}
.lcard p{font-size:14px;color:var(--g500);margin-top:4px}
.lcard p.star{color:var(--black);font-weight:500}
/* how far guests scroll */
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 12px}
.vgrid div{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.vgrid b{display:block;font-family:var(--mono);font-weight:400;font-size:28px;line-height:1.1}
.vgrid span{display:block;font-size:13.5px;color:var(--g500);margin-top:2px}
.reach{height:8px;border-radius:4px;background:var(--g100);overflow:hidden;margin-bottom:12px}
.reach i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.fn{font-size:12.5px;color:var(--g400);margin-top:-6px;margin-bottom:2px}
/* the single-listing field (the form's link was a host profile or not a listing) */
.ask{margin-top:18px;text-align:left}
.ask label{display:block;font-size:13px;font-weight:600;color:var(--g600);margin:0 0 6px 2px}
.lurl{width:100%;height:52px;border-radius:14px;border:1px solid var(--line);background:#fff;padding:0 14px;font-size:16px;box-shadow:var(--sh-chip);outline:none;-webkit-appearance:none;appearance:none}
.lurl:focus{border-color:var(--black);box-shadow:0 0 0 3px rgba(50,48,47,.08)}
.ask-hint{font-size:13.5px;color:var(--g500);margin:6px 2px 0}
.ask-hint.bad{color:var(--terra)}
.op-term{font-size:13px;color:var(--g500);text-align:right}

/* ── offer: a sales page. The plan and the price are on the first screen (the price button is
   pinned on phones, a sticky card on desktop); the plan, timeline, video, proof and FAQ follow
   for whoever wants more. The price button still reveals in three beats: appear, strike $998, turn green. ── */
.op-head{text-align:left}
.op-sub{font-size:16px;line-height:1.5;color:var(--g500);margin-top:8px;text-wrap:pretty}
.offer{text-align:left;container:offer/inline-size}
.op-card{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh-card);padding:18px 18px 16px}
.op-k{font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
.op-list{list-style:none;display:grid;gap:10px}
.op-list li{display:flex;gap:10px;align-items:flex-start;font-size:15.5px;line-height:1.4}
.op-list li svg{flex:0 0 auto;width:20px;height:20px;padding:4px;margin-top:0;border-radius:50%;background:var(--accent-light);color:var(--accent)}
.op-month{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:14.5px;color:var(--g600)}
.tbd{font-size:13px;color:var(--g500);border:1px dashed var(--g300);border-radius:8px;padding:4px 10px;white-space:nowrap}
.paybar{margin-top:16px}
.pricebtn{display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:12px;width:100%;border:1.5px solid var(--g200);background:#fff;color:var(--black);border-radius:16px;padding:20px 22px;text-align:left;cursor:default;pointer-events:none;opacity:0;transform:translateY(12px);
  transition:opacity .45s var(--silk),transform .45s var(--silk),background-color .45s var(--silk),border-color .45s var(--silk),color .45s var(--silk),box-shadow .45s var(--silk)}
.offer.s1 .pricebtn{opacity:1;transform:none}
.pb-k{display:block;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--g500);transition:color .45s}
.pb-prices{display:flex;align-items:baseline;gap:14px;margin-top:4px}
.pb-was{position:relative;font-family:var(--mono);font-size:28px;color:var(--black);transition:color .45s}
.pb-was i{position:absolute;left:-6%;top:52%;height:3px;width:0;background:var(--terra);border-radius:2px;transform:rotate(-14deg);transform-origin:left center;transition:width .4s var(--silk)}
.offer.s2 .pb-was i{width:112%}
.offer.s2 .pb-was{color:var(--g400)}
.pb-now{font-family:var(--mono);font-size:50px;line-height:1;color:var(--accent);opacity:0;transform:translateY(-14px);transition:opacity .4s var(--silk) .2s,transform .4s var(--silk) .2s,color .45s}
.offer.s2 .pb-now{opacity:1;transform:none}
.pb-go{display:inline-flex;align-items:center;gap:8px;font-size:17px;font-weight:600;white-space:nowrap;opacity:0;transform:translateX(-8px);transition:opacity .4s var(--silk) .15s,transform .4s var(--silk) .15s}
.pb-go svg{width:17px;height:17px}
.offer.s3 .pricebtn{background:var(--accent);border-color:var(--accent);color:#fff;cursor:pointer;pointer-events:auto;box-shadow:0 10px 28px rgba(74,103,65,.28)}
.offer.s3 .pricebtn:active{background:var(--accent-dark)}
.offer.s3 .pb-k{color:rgba(255,255,255,.75)}
.offer.s3 .pb-was{color:rgba(255,255,255,.6)}
.offer.s3 .pb-was i{background:#fff}
.offer.s3 .pb-now{color:#fff}
.offer.s3 .pb-go{opacity:1;transform:none}
.pricebtn:disabled{cursor:default}
.op-trust{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--g500);margin-top:9px}
.op-trust svg{width:12px;height:12px;color:var(--accent)}
.op-sec{margin-top:36px}
.op-sec > h2{font-family:var(--heading);font-weight:400;font-size:24px;letter-spacing:-.015em;line-height:1.2}
.op-note{font-size:15px;line-height:1.5;color:var(--g500);margin-top:4px}
.op-sec > h2 + .media{margin-top:14px}
/* your plan, built from their answers */
.plan{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.pl-g{font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--g500);padding:12px 16px 6px;background:var(--g50);border-bottom:1px solid var(--line)}
.plan ul{list-style:none}
.plan li{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line);font-size:15px;line-height:1.35}
.pl-n{flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:var(--g100);color:var(--g600);display:grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:500}
.pl-t{flex:1;min-width:0}
.pl-keep{display:flex;align-items:center;gap:10px;padding:12px 16px;font-size:14.5px;color:var(--g600)}
.pl-keep svg{flex:0 0 auto;width:20px;height:20px;padding:4px;border-radius:50%;background:var(--accent-light);color:var(--accent)}
/* how it works, with real dates */
.tl{list-style:none;margin-top:14px;position:relative}
.tl::before{content:"";position:absolute;left:5px;top:10px;bottom:14px;width:2px;background:var(--g200)}
.tl li{position:relative;padding:0 0 18px 26px}
.tl li:last-child{padding-bottom:0}
.tl li::before{content:"";position:absolute;left:0;top:5px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--accent)}
.tl li:first-child::before{background:var(--accent)}
.tl-d{display:block;font-family:var(--mono);font-size:12.5px;color:var(--accent);letter-spacing:.02em}
.tl b{display:block;font-size:16px;font-weight:600;margin-top:1px}
.tl span.tl-x{display:block;font-size:15px;line-height:1.45;color:var(--g500);margin-top:2px}
/* proof: two real listings near their size */
.proof{display:grid;gap:12px;margin-top:14px}
.pf{display:flex;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:var(--sh-chip)}
.pf img{flex:0 0 auto;width:88px;height:88px;border-radius:12px;object-fit:cover}
.pf-b{flex:1;min-width:0}
.pf-b b{display:block;font-size:15.5px;font-weight:600}
.pf-b small{display:block;font-size:13px;color:var(--g500)}
.pf-up{display:flex;align-items:baseline;gap:8px;margin-top:6px}
.pf-up strong{font-family:var(--mono);font-weight:500;font-size:22px;color:var(--accent)}
.pf-up span{font-size:13px;color:var(--g500)}
.pf-was{font-family:var(--mono);font-size:13.5px;color:var(--g600);margin-top:2px}
.pf-src{font-size:13px;line-height:1.5;color:var(--g500);margin-top:10px}
.pf-src a{color:var(--accent);font-weight:500}
/* faq */
.faq{margin-top:12px;border-top:1px solid var(--line)}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 2px;font-size:16px;font-weight:500}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"";flex:0 0 auto;width:9px;height:9px;border-right:2px solid var(--g400);border-bottom:2px solid var(--g400);transform:translateY(-3px) rotate(45deg);transition:transform .25s var(--silk)}
.faq details[open] summary::after{transform:translateY(2px) rotate(-135deg);border-color:var(--accent)}
.faq p{font-size:15.5px;line-height:1.55;color:var(--g600);padding:0 2px 16px}
.op-foot{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:22px;font-size:13.5px;color:var(--g500)}
.op-foot svg{width:15px;height:15px;color:var(--accent)}
.tail{justify-content:center;margin-top:18px}
.tail:empty{display:none}
details.data{margin-top:22px;font-size:14px}
details.data summary{cursor:pointer;color:var(--accent);font-weight:500}
details.data pre{margin-top:10px;background:var(--g50);border:1px solid var(--line);border-radius:10px;padding:14px;font-family:var(--mono);font-size:12px;line-height:1.5;overflow-x:auto;white-space:pre}

/* ── review mode (?review=1) ── */
.review{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);transform:translateX(-50%);z-index:60;display:flex;gap:6px;align-items:center;padding:6px;border-radius:14px;background:rgba(50,48,47,.94);box-shadow:0 10px 30px rgba(50,48,47,.3);max-width:calc(100vw - 24px)}
.review button,.review select{height:32px;border-radius:9px;padding:0 10px;background:rgba(255,255,255,.12);color:#fff;font-size:13px;font-weight:500;border:0;white-space:nowrap}
.review select{min-width:0;max-width:200px}
.review select option{color:var(--black)}
body.reviewing .stage{padding-bottom:96px}

/* ── 720px and up: the /audit form-card skin ─────────────────────────────── */
@media(min-width:720px){
  :root{--bar-h:68px}
  body{background:linear-gradient(180deg,#f6f8f4,#fff) 0 0/100% 620px no-repeat,#fff}
  body::before{height:640px;background:radial-gradient(ellipse 55% 60% at 50% 0%,rgba(74,103,65,.1),rgba(74,103,65,0) 72%)}
  .bar-in{display:grid;grid-template-columns:1fr minmax(0,280px) 1fr;padding:0 32px}
  .back{display:none!important}
  .back:not([hidden]) + .brand,.brand{display:flex}
  .brand .ln{display:block}
  .brand .lm{width:30px;height:30px}
  .segs{width:100%}
  .seg i{background:var(--accent)}
  .rchip{display:flex;align-items:center;justify-self:end;gap:9px;font-size:12.5px;font-weight:500;color:var(--g500);transition:opacity .3s var(--silk)}
  .rchip.off{opacity:0}
  .rchip i{display:block;width:54px;height:4px;border-radius:2px;background:var(--g200);overflow:hidden}
  .rchip i b{display:block;height:100%;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .6s var(--silk)}

  .stage{padding:clamp(20px,4vh,48px) 32px 64px}
  .scr{max-width:640px}
  .scr.wide{max-width:680px}
  .scr.mid{max-width:760px}

  .qcard{text-align:left;background:#fff;border-radius:16px;box-shadow:var(--sh-lg);padding:28px 28px 24px}
  .kick{min-height:0;padding:0;border:0;background:none;box-shadow:none;border-radius:0;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
  .kick svg{width:12px;height:12px}
  .h{font-size:clamp(28px,3vw,34px);line-height:1.13}
  .h.q{font-size:clamp(22px,2.1vw,25px);line-height:1.28}
  .lede{font-size:16px;font-weight:300;line-height:1.65}

  .opts{margin-top:22px}
  .ob{min-height:0;padding:14px 18px;gap:13px;border-radius:8px;border:1.5px solid var(--g200);box-shadow:none;overflow:hidden}
  .ob::before{content:"";position:absolute;top:0;right:0;bottom:0;left:0;z-index:0;background:var(--accent-light);opacity:0;transform:scaleX(0);transform-origin:left;transition:opacity .35s,transform .4s var(--silk)}
  .ot,.od{z-index:1}  /* order:-1 would otherwise paint the dot under the fill */
  .ot b{font-size:15.5px}
  .ot small{font-size:13.5px}
  .od{order:-1;width:18px;height:18px}
  .opt:active .ob{background:#fff}
  .opt input:checked + .ob{background:#fff;border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 1.5px var(--accent)}
  .opt input:checked + .ob::before{opacity:1;transform:scaleX(1)}
  .opt input:checked + .ob small{color:var(--g600)}
  .opt input:checked + .ob .od{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 3.5px #fff}
  .note{transition:grid-template-rows .38s var(--silk),opacity .3s var(--silk),transform .3s var(--silk)}
  .note textarea{border-radius:8px;border:1.5px solid var(--g200);box-shadow:none;font-size:15px}
  .note textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(74,103,65,.1)}

  .acts{margin-top:24px}

   $500/mo, 3-month-then-month-to-month terms into the service agreement and charges onboarding only) ── */
var PRICE={was:996,now:498,monthly:500,term:3};
function checkoutUrl(){

/* ── the live listing report (RevWhisper Growth Hub) ──
   The visitor's browser starts the report as soon as they land: Growth Hub's public create-analysis
   endpoint allows revwhisper.com and rate-limits per visitor. delivery:'embedded' tells Growth Hub
   this page shows the report itself: no report email and no CRM webhook.
   /api/listing-report reads it back here once Growth Hub's 15-page check is done: about 10 seconds
   for the first pass and usually under a minute in all (instant when the listing was reported in
   the last day). The check takes minutes, so it's ready by the report screen unless something
   went wrong. Only a single listing link is accepted. */
var GH='https://app.revwhisper.com';
var RKEY='rw_listing_check_report';
var REPORT_WAIT_MS=45000;   // on the report screen, how long to wait before saying it's taking longer
function listingIdFrom(u){
  var t=String(u||'').trim();if(!t)return null;
  if(!/^https?:\/\//i.test(t))t='https://'+t;
  var x;try{x=new URL(t);}catch(e){return null;}
  if(!/(^|\.)airbnb\.[a-z]{2,3}(\.[a-z]{2})?$/i.test(x.hostname))return null;
  var m=x.pathname.match(/^\/rooms\/(?:plus\/)?(\d{1,20})\/?$/);
  return m?m[1]:null;
}
// The form's revenue band ("Under $40k", "$40k–$70k", "CA$55k+") as one number for Growth Hub's upside model.
function revenueFrom(band){
  var t=String(band||'').replace(/,/g,'');
  var nums=(t.match(/\d+(\.\d+)?\s*[kKmM]?/g)||[]).map(function(v){var n=parseFloat(v);if(/k/i.test(v))n*=1e3;else if(/m/i.test(v))n*=1e6;return n;}).filter(function(n){return n>0;});
  if(!nums.length)return 30000;
  if(/under|less|below/i.test(t))return Math.round(nums[0]*0.75);
  if(nums.length>1)return Math.round((nums[0]+nums[1])/2);
  return Math.round(nums[0]);
}
function reportData(){
  try{var r=JSON.parse(sessionStorage.getItem(RKEY)||'null');return r&&S.report&&r.id===S.report.id?r.data:null;}catch(e){return null;}
}
function keepReport(data){try{sessionStorage.setItem(RKEY,JSON.stringify({id:S.report.id,data:data}));}catch(e){}}
function startReport(){
  var id=listingIdFrom(S.lead.url),r=S.report;
  if(!id||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(S.lead.email||''))return;
  // already started (or Growth Hub already rejected this exact link: wait for a new one;
  // a start that failed is retried at most once a minute, as they move through the check)
  if(r&&r.listing===id&&(r.id||r.error==='listing'||((r.pending||r.error==='failed')&&Date.now()-r.at<60000)))return;
  S.report={listing:id,pending:true,at:Date.now()};save();
  var body={email:S.lead.email,airbnbUrl:'https://www.airbnb.com/rooms/'+id,revenue:revenueFrom(S.lead.revenue),reportType:'ranking',delivery:'embedded',
    attribution:Object.assign({},typeof window.rwAttribution==='function'?window.rwAttribution():{},{source:'listing-check'})};
  if(S.lead.name)body.fullName=S.lead.name;
  if(S.lead.phone)body.phone=S.lead.phone;
  var at=S.report.at;
  fetch(GH+'/api/public/create-analysis',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(function(res){return res.json().catch(function(){return {};}).then(function(j){return {status:res.status,j:j};});})
    .then(function(x){
      var pid=x.j&&x.j.analysis&&x.j.analysis.publicId;
      S.report=pid?{listing:id,id:String(pid),at:at}:{listing:id,error:x.status===400?'listing':'failed',at:at};
      save();
      track(pid?'listing_check_report_started':'listing_check_report_failed',{reason:pid?'':S.report.error,status:x.status});
      if(STEPS[S.i].k==='report'){RS=null;render(1);}
    })
    .catch(function(){S.report={listing:id,error:'failed',at:at};save();track('listing_check_report_failed',{reason:'network'});if(STEPS[S.i].k==='report'){RS=null;render(1);}});
}
function fetchReport(cb){
  if(!S.report||!S.report.id)return cb(null);
  fetch('/api/listing-report?id='+encodeURIComponent(S.report.id),{cache:'no-store'})
    .then(function(r){return r.json();})
    .then(function(j){if(j&&j.status==='ready')keepReport(j);cb(j);})
    .catch(function(){cb(null);});
}
// Report screen state: ready | loading | slow (still building, keeps checking) | listing (re-ask) | none
var RS=null,pollT=0,waitFrom=0;
function reportState(){
  if(reportData())return 'ready';
  var r=S.report;
  if(r&&r.error==='listing')return 'listing';
  if(!r||r.error||!r.id&&!r.pending)return 'none';
  return RS==='slow'?'slow':'loading';
}
function waitForReport(){
  clearTimeout(pollT);
  if(STEPS[S.i].k!=='report')return;
  fetchReport(function(j){
    if(STEPS[S.i].k!=='report')return;
    if(j&&j.status==='ready'){track('listing_check_report',{state:'ready',wait_ms:Date.now()-waitFrom});RS='ready';render(1);return;}
    if(RS!=='slow'&&Date.now()-waitFrom>REPORT_WAIT_MS){track('listing_check_report',{state:'slow'});RS='slow';render(1);}
    pollT=setTimeout(waitForReport,4000);
  });
}


/* ── history: each screen is a history entry, so the phone's back swipe steps back a screen ── */
function hashOf(i){var st=STEPS[i];return i===0?'':'#'+(st.k==='strat'?'s'+(st.n+1):st.k);}
function indexOfHash(h){h=String(h||'');if(!h||h==='#')return 0;for(var i=0;i<STEPS.length;i++)if(hashOf(i)===h)return i;return -1;}
function urlOf(i){return location.pathname+location.search+hashOf(i);}
var busy=false;
function go(to,o){
  o=o||{};
  if(to<0||to>=STEPS.length||busy)return;
  var dir=to>=S.i?1:-1,d=(history.state&&history.state.d)||0;
  S.i=to;save();
  if(o.replace)try{history.replaceState({lc:to,d:d},'',urlOf(to));}catch(e){}
  else try{history.pushState({lc:to,d:d+1},'',urlOf(to));}catch(e){}
  render(dir);
}
function back(){
  if(S.i<=0)return;
  if(history.state&&history.state.d>0)history.back();
  else go(S.i-1,{replace:true});
}
window.addEventListener('popstate',function(e){
  var t=e.state&&typeof e.state.lc==='number'?e.state.lc:indexOfHash(location.hash);
  if(t<0)t=0;
  if(t===S.i)return;
  var dir=t>S.i?1:-1;
  busy=false;S.i=t;save();render(dir);
});

/* ── the one video element: moved from screen to screen. Once a tap has let it play with
   sound, every later video keeps sound (iOS grants that per element, not per page). ── */
var PV=document.createElement('video');
PV.setAttribute('playsinline','');PV.setAttribute('webkit-playsinline','');PV.playsInline=true;
PV.preload='auto';PV.setAttribute('disablepictureinpicture','');PV.setAttribute('disableremoteplayback','');
var cur=null,curBar=null,curCap=null,capLast=null,raf=0,blessed=false;
function setV(s){if(cur)cur.setAttribute('data-state',s);}
function vState(){return cur?cur.getAttribute('data-state'):'';}
PV.addEventListener('playing',function(){setV(PV.muted?'muted':'playing');loop();});
PV.addEventListener('pause',function(){
  tick();
  // a pause left over from the previous screen's video lands while the new one is still loading: ignore it
  if(!cur||PV.ended||vState()==='loading')return;
  setV('paused');
});
PV.addEventListener('ended',function(){tick();setV('ended');track('listing_check_video_complete',{video:(PV.getAttribute('data-src')||'').split('/').pop().split('.')[0]});});
PV.addEventListener('volumechange',function(){if(cur&&!PV.paused)setV(PV.muted?'muted':'playing');});
PV.addEventListener('error',function(){if(cur&&PV.getAttribute('src'))setV('error');});
function loop(){
  if(raf)return;
  var f=function(){raf=0;tick();if(!PV.paused&&PV.isConnected)raf=requestAnimationFrame(f);};
  raf=requestAnimationFrame(f);
}
function tick(){
  if(!cur)return;
  if(curBar&&PV.duration)curBar.style.transform='scaleX('+Math.min(1,PV.currentTime/PV.duration).toFixed(4)+')';
  if(!curCap)return;
  var C=CAPT[cur.getAttribute('data-n')],t=PV.currentTime,txt='';
  if(C&&!PV.paused&&t<C.e){for(var j=0;j<C.c.length;j++){if(C.c[j][0]<=t)txt=C.c[j][1];else break;}}
  if(txt!==capLast){capLast=txt;if(txt){curCap.textContent=txt;curCap.classList.add('on');}else curCap.classList.remove('on');}
}
function mountMedia(el){
  var m=el.querySelector('.media');
  cur=m;capLast=null;
  if(!m){PV.pause();if(PV.parentNode)PV.parentNode.removeChild(PV);curBar=curCap=null;return;}
  curBar=m.querySelector('.vprog i');curCap=m.querySelector('.vcap span');
  var src=m.getAttribute('data-src');
  setV('loading');
  m.querySelector('.frame').insertBefore(PV,m.querySelector('.frame').firstChild);
  if(m.getAttribute('data-poster'))PV.setAttribute('poster',m.getAttribute('data-poster'));else PV.removeAttribute('poster');
  if(PV.getAttribute('data-src')!==src){PV.setAttribute('data-src',src);PV.src=src;}
  else{try{PV.currentTime=0;}catch(e){}}
  if(RM.matches||m.hasAttribute('data-hold')){setV('idle');return;}   // reduced motion, or below the fold: wait for a tap
  startV();
  prefetchNext();
}
function startV(){
  var m=cur;if(!m)return;
  PV.muted=false;
  var p=PV.play();
  if(!p||!p.then)return;
  p.then(function(){if(cur===m)setV(PV.muted?'muted':'playing');}).catch(function(err){
    if(cur!==m||(err&&err.name==='AbortError'))return;
    // sound isn't allowed yet: play muted (the captions carry it) and offer sound
    PV.muted=true;
    var p2=PV.play();
    if(p2&&p2.then)p2.then(function(){if(cur===m)setV('muted');}).catch(function(){if(cur===m)setV('idle');});
  });
}
function playNow(){
  if(PV.ended)try{PV.currentTime=0;}catch(e){}
  PV.muted=false;
  var p=PV.play();
  if(p&&p.catch)p.catch(function(){PV.muted=true;PV.play().catch(function(){setV('idle');});});
}
function soundOn(){try{PV.currentTime=0;}catch(e){}playNow();}
function vToggle(){
  var s=vState();
  if(s==='muted')return soundOn();
  if(s==='error')return retry();
  if(PV.paused)playNow();else PV.pause();
}
function retry(){if(!cur)return;var src=cur.getAttribute('data-src');setV('loading');PV.setAttribute('data-src',src);PV.src=src;startV();}
// The first tap anywhere lets this element play with sound from then on, without changing what it's doing now.
function bless(){
  if(blessed)return;blessed=true;
  var wasPaused=PV.paused,wasMuted=PV.muted;
  try{PV.muted=false;var p=PV.play();if(p&&p.catch)p.catch(function(){});if(wasPaused)PV.pause();PV.muted=wasMuted;}catch(e){}
}
['touchend','click','keydown'].forEach(function(t){document.addEventListener(t,bless,{capture:true,passive:true});});
var prefetched={};
function srcFor(st){if(!st)return '';if(st.k==='strat')return V+STRATS[st.n].f+'.mp4';return VID[st.k]?V+VID[st.k]+'.mp4':'';}
function prefetchNext(){
  var src=srcFor(STEPS[S.i+1]);if(!src||prefetched[src])return;
  var c=navigator.connection;if(c&&(c.saveData||/(^|-)2g$/.test(c.effectiveType||'')))return;
  prefetched[src]=1;
  setTimeout(function(){try{fetch(src,{priority:'low'}).then(function(r){return r.blob();}).catch(function(){});}catch(e){}},2500);
}

  requestAnimationFrame(f);

  document.body.appendChild(rb);document.body.classList.add('reviewing');
  rb.addEventListener('click',function(e){
    var b=e.target.closest('[data-r]');if(!b)return;var r=b.getAttribute('data-r');
    if(r==='prev')go(S.i-1);
    if(r==='next')go(S.i+1);
    if(r==='fill'){
      S.lead={name:'Sam',email:S.lead.email||'sam@example.com',phone:'905-555-0142',url:S.lead.url||'airbnb.com/rooms/12345678',listings:'1',revenue:S.lead.revenue||'',submittedAt:S.lead.submittedAt};
      S.strat=['partly','no','no','yes','no','partly','no','partly','no','partly'];
      save();render(0);
    }
  });
  document.getElementById('jump').addEventListener('change',function(){go(+this.value);});
  document.addEventListener('keydown',function(e){
    if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;
    if(e.key==='ArrowRight')go(S.i+1);
    if(e.key==='ArrowLeft')go(S.i-1);
  });
}

/* ── start: resume where they were, or the screen in the URL when reviewing ── */
var at=S.i||0;
if(REVIEW){
  var hi=indexOfHash(location.hash);if(hi>=0)at=hi;
  var rid=qs.get('report');if(rid&&/^[A-Za-z0-9_-]{8,32}$/.test(rid)){S.report={listing:'review',id:rid,at:Date.now()-150000};save();}
}
startReport();
S.i=at;
try{history.replaceState({lc:at,d:0},'',urlOf(at));}catch(e){}
render(0);
})();
</script>
</body>
