<!-- Attribution capture (cookie-free) — same contract as the live homepage, so a lead
     submitted from this preview still carries its utm/click ids into the CRM. -->
<script>
(function(){
  var key='rw_attribution';
  var TTL=7776000000; // 90 days — keep the last paid touch across tabs/sessions
  var params=new URLSearchParams(window.location.search);
  var utmFields=['utm_source','utm_medium','utm_campaign','utm_term','utm_content'];
  var clickFields=['fbclid','gclid','ttclid','twclid','msclkid','li_fat_id'];
  var trackedFields=utmFields.concat(clickFields);
  var hasTracked=trackedFields.some(function(f){return params.has(f);});
  function rwGet(k){try{return localStorage.getItem(k)||sessionStorage.getItem(k);}catch(e){try{return sessionStorage.getItem(k);}catch(e2){return null;}}}
  function rwSet(k,v){try{localStorage.setItem(k,v);}catch(e){try{sessionStorage.setItem(k,v);}catch(e2){}}}
  var prev=null;try{prev=JSON.parse(rwGet(key));}catch(e){prev=null;}
  var fresh=prev&&prev.arrived_at&&((Date.now()-new Date(prev.arrived_at).getTime())<TTL);
  if(hasTracked||!fresh){
    var data={};
    trackedFields.forEach(function(f){if(params.get(f))data[f]=params.get(f);});
    try{data.referrer=document.referrer?new URL(document.referrer).hostname:'direct';}catch(e){data.referrer=document.referrer||'direct';}
    data.landing_page=window.location.pathname;
    data.arrived_at=new Date().toISOString();
    rwSet(key,JSON.stringify(data));
  }
})();
</script>

<!-- GA4 only. The Meta and X pixels are deliberately NOT loaded on this review page, so
     review traffic stays out of ad audiences. audit-widget.js guards every fbq/rwXTrack
     call, so the form runs unchanged without them. -->
<script>
window.dataLayer=window.dataLayer||[];
function gtag(){dataLayer.push(arguments);}
gtag('consent','default',{'analytics_storage':'denied','ad_storage':'denied'});
gtag('js',new Date());
gtag('config','G-Y1FYZ5849B');
function rwTrack(e,p){gtag('event',e,p||{});}
(function(){
  var c=null;try{c=localStorage.getItem('rw_cookie_consent');}catch(e){}
  if(c==='accepted'){gtag('consent','update',{'analytics_storage':'granted','ad_storage':'granted'});}
  var loaded=false;
  function load(){
    if(loaded)return;loaded=true;
    var g=document.createElement('script');g.async=true;g.src='https://www.googletagmanager.com/gtag/js?id=G-Y1FYZ5849B';document.head.appendChild(g);
  }
  ['scroll','click','touchstart','keydown','mousemove'].forEach(function(e){window.addEventListener(e,load,{once:true,passive:true});});
  if('requestIdleCallback' in window)requestIdleCallback(load,{timeout:4000});
  else setTimeout(load,4000);
})();
</script>
