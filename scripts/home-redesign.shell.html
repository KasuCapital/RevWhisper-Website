<!-- Attribution capture (cookie-free) — a lead carries its utm/click ids into the CRM. -->
<script>
(function(){
  var key='rw_attribution';
  var TTL=7776000000; // 90 days — keep the last paid touch across tabs/sessions
  var params=new URLSearchParams(window.location.search);
  var utmFields=['utm_source','utm_medium','utm_campaign','utm_term','utm_content'];
  var clickFields=['fbclid','gclid','ttclid','twclid','msclkid','li_fat_id'];
  var trackedFields=utmFields.concat(clickFields);
  var hasTracked=trackedFields.some(function(f){return params.has(f);});
  function rwGet(k){try{return localStorage.getItem(k)||sessionStorage.getItem(k);}catch(e){try{return sessionStorage.getItem(k);}catch(e2){return null;}}}
  function rwSet(k,v){try{localStorage.setItem(k,v);}catch(e){try{sessionStorage.setItem(k,v);}catch(e2){}}}
  var prev=null;try{prev=JSON.parse(rwGet(key));}catch(e){prev=null;}
  var fresh=prev&&prev.arrived_at&&((Date.now()-new Date(prev.arrived_at).getTime())<TTL);
  if(hasTracked||!fresh){
    var data={};
    trackedFields.forEach(function(f){if(params.get(f))data[f]=params.get(f);});
    try{data.referrer=document.referrer?new URL(document.referrer).hostname:'direct';}catch(e){data.referrer=document.referrer||'direct';}
    data.landing_page=window.location.pathname;
    data.arrived_at=new Date().toISOString();
    rwSet(key,JSON.stringify(data));
  }
})();
</script>

<!-- Cookie Consent + GA4 (consent-mode) -->
<script>
window.dataLayer=window.dataLayer||[];
function gtag(){dataLayer.push(arguments);}
gtag('consent','default',{'analytics_storage':'denied','ad_storage':'denied'});
gtag('js',new Date());
gtag('config','G-Y1FYZ5849B');
function rwTrack(e,p){gtag('event',e,p||{});}
(function(){
  var c=null;try{c=localStorage.getItem('rw_cookie_consent');}catch(e){}
  if(c==='accepted'){gtag('consent','update',{'analytics_storage':'granted','ad_storage':'granted'});return;}
  if(c==='declined')return;
  document.addEventListener('DOMContentLoaded',function(){
    var b=document.createElement('div');b.id='rw-consent';
    b.innerHTML='<div style="position:fixed;bottom:0;left:0;right:0;z-index:9999;padding:16px 24px;background:#32302F;color:#fff;font-family:DM Sans,system-ui,sans-serif;font-size:14px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;box-shadow:0 -4px 24px rgba(0,0,0,.15)"><span style="flex:1;min-width:240px;line-height:1.5">We use cookies to analyze site usage and improve your experience.</span><div style="display:flex;gap:10px;flex-shrink:0"><button id="rw-decline" style="background:transparent;color:#ccc8c5;border:1.5px solid #706b68;padding:8px 20px;border-radius:6px;font-size:13px;font-family:inherit;cursor:pointer">Decline</button><button id="rw-accept" style="background:#4A6741;color:#fff;border:none;padding:8px 20px;border-radius:6px;font-size:13px;font-family:inherit;cursor:pointer;font-weight:500">Accept</button></div></div>';
    document.body.appendChild(b);
    document.getElementById('rw-accept').addEventListener('click',function(){localStorage.setItem('rw_cookie_consent','accepted');b.remove();gtag('consent','update',{'analytics_storage':'granted','ad_storage':'granted'});});
    document.getElementById('rw-decline').addEventListener('click',function(){localStorage.setItem('rw_cookie_consent','declined');b.remove();});
  });
})();
</script>

<!-- Deferred loader: fetch tracker scripts on first interaction or idle -->
<script>
(function(){
  var loaded=false;
  function load(){
    if(loaded)return;loaded=true;
    var g=document.createElement('script');g.async=true;g.src='https://www.googletagmanager.com/gtag/js?id=G-Y1FYZ5849B';document.head.appendChild(g);
    var f=document.createElement('script');f.async=true;f.src='https://connect.facebook.net/en_US/fbevents.js';document.head.appendChild(f);
  }
  ['scroll','click','touchstart','keydown','mousemove'].forEach(function(e){window.addEventListener(e,load,{once:true,passive:true});});
  if('requestIdleCallback' in window)requestIdleCallback(load,{timeout:4000});
  else setTimeout(load,4000);
})();
</script>
