<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Text the scan guide to your cleaner | RevWhisper</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Lora:wght@400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: #F8F7F6; color: #32302F; font-family: 'DM Sans', Arial, Helvetica, sans-serif; font-size: 17px; line-height: 1.6; }
  .card { max-width: 520px; margin: 40px auto; background: #FFFFFF; border: 1px solid #E0DCDA; border-radius: 16px; padding: 36px 28px; }
  h1 { font-family: 'Lora', Georgia, serif; font-weight: 400; font-size: 28px; line-height: 1.25; margin: 0 0 14px; }
  p { margin: 0 0 16px; }
  .btn { display: block; width: 100%; text-align: center; padding: 15px 12px; border-radius: 10px; font-weight: 700; font-size: 16px; text-decoration: none; border: 2px solid #4A6741; cursor: pointer; font-family: inherit; margin-bottom: 12px; }
  .primary { background: #4A6741; color: #FFFFFF; }
  .secondary { background: #FFFFFF; color: #4A6741; }
  .msg { background: #F8F7F6; border-left: 3px solid #4A6741; padding: 14px 16px; font-size: 15px; margin: 8px 0 18px; word-break: break-word; }
  .note { font-size: 14px; color: #6f6a67; }
  .brand { text-align: center; font-size: 13px; color: #6f6a67; margin-top: 20px; }
  .brand b { color: #4A6741; }
</style>
</head>
<body>
  <div class="card">
    <h1>Send the scan guide to your cleaner</h1>
    <p>Tap the button and your messages app opens with this note filled in. Just pick your cleaner as the recipient.</p>
    <div class="msg" id="msg"></div>
    <a class="btn primary" id="sms" href="#">Open Messages</a>
    <button class="btn secondary" id="copy" type="button">Copy the message</button>
    <p class="note" id="desktop" hidden>On a computer? Copy the message and send it from your phone, or by email.</p>
  </div>
  <p class="brand"><b>RevWhisper</b><br>Stop guessing. Start whispering.</p>

<script>
  var GUIDE = "https://revwhisper.com/cleaner-scan-guide.pdf";
  var MESSAGE = "Hi, Airbnb just added 3D floor plans to listings. Could you scan the home with the Airbnb app after your next clean? Here's a quick guide with every step (PDF): " + GUIDE;

  var ua = navigator.userAgent || "";
  var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/i.test(ua);
  var body = encodeURIComponent(MESSAGE);
  // iPhone and Android write the SMS link slightly differently
  var smsLink = isIOS ? "sms:&body=" + body : "sms:?body=" + body;

  document.getElementById("msg").textContent = MESSAGE;
  document.getElementById("sms").setAttribute("href", smsLink);

  if (isIOS || isAndroid) {
    // Try to open Messages straight away; the button stays as a backup
    setTimeout(function () { window.location.href = smsLink; }, 400);
  } else {
    document.getElementById("sms").hidden = true;
    document.getElementById("desktop").hidden = false;
  }

  document.getElementById("copy").addEventListener("click", function () {
    var btn = this;
    function done() { btn.textContent = "Copied"; setTimeout(function () { btn.textContent = "Copy the message"; }, 2000); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(MESSAGE).then(done, fallback);
    } else { fallback(); }
    function fallback() {
      var t = document.createElement("textarea");
      t.value = MESSAGE; document.body.appendChild(t); t.select();
      try { document.execCommand("copy"); done(); } catch (e) {}
      document.body.removeChild(t);
    }
  });
</script>
</body>
</html>
