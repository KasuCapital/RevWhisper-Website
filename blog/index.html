<!-- Attribution tracking (cookie-free) -->
<script>
(function(){
  var key='rw_attribution';
  var params=new URLSearchParams(window.location.search);
  var utmFields=['utm_source','utm_medium','utm_campaign','utm_term','utm_content'];
  var hasUtm=utmFields.some(function(f){return params.has(f);});
  if(hasUtm||!sessionStorage.getItem(key)){
    var data={};
    utmFields.forEach(function(f){if(params.get(f))data[f]=params.get(f);});
    try{data.referrer=document.referrer?new URL(document.referrer).hostname:'direct';}catch(e){data.referrer=document.referrer||'direct';}
    data.landing_page=window.location.pathname;
    data.arrived_at=new Date().toISOString();
    sessionStorage.setItem(key,JSON.stringify(data));
  }
})();
</script>
<!-- Cookie Consent + GA4 (consent-gated) -->
<script>
window.dataLayer=window.dataLayer||[];
function gtag(){dataLayer.push(arguments);}
function rwLoadGA(){
  var s=document.createElement('script');s.async=true;
  s.src='https://www.googletagmanager.com/gtag/js?id=G-Y1FYZ5849B';
  document.head.appendChild(s);
  gtag('js',new Date());gtag('config','G-Y1FYZ5849B');
}
function rwTrack(e,p){if(localStorage.getItem('rw_cookie_consent')==='accepted')gtag('event',e,p||{});}
(function(){
  var c=localStorage.getItem('rw_cookie_consent');
  if(c==='accepted'){rwLoadGA();return;}
  if(c==='declined')return;
  document.addEventListener('DOMContentLoaded',function(){
    var b=document.createElement('div');b.id='rw-consent';
    b.innerHTML='<div style="position:fixed;bottom:0;left:0;right:0;z-index:9999;padding:16px 24px;background:#32302F;color:#fff;font-family:DM Sans,system-ui,sans-serif;font-size:14px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;box-shadow:0 -4px 24px rgba(0,0,0,.15)"><span style="flex:1;min-width:240px;line-height:1.5">We use cookies to analyze site usage and improve your experience.</span><div style="display:flex;gap:10px;flex-shrink:0"><button id="rw-decline" style="background:transparent;color:#ccc8c5;border:1.5px solid #706b68;padding:8px 20px;border-radius:6px;font-size:13px;font-family:inherit;cursor:pointer">Decline</button><button id="rw-accept" style="background:#4A6741;color:#fff;border:none;padding:8px 20px;border-radius:6px;font-size:13px;font-family:inherit;cursor:pointer;font-weight:500">Accept</button></div></div>';
    document.body.appendChild(b);
    document.getElementById('rw-accept').addEventListener('click',function(){localStorage.setItem('rw_cookie_consent','accepted');b.remove();rwLoadGA();});
    document.getElementById('rw-decline').addEventListener('click',function(){localStorage.setItem('rw_cookie_consent','declined');b.remove();});
  });
})();
</script>

<style>
/* ── Reset & Base ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;overflow-x:hidden}
body{font-family:'DM Sans','system-ui','Helvetica Neue',sans-serif;background:#fff;color:#32302F;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}

/* ── Design Tokens ── */
:root{
  --black:#32302F;
  --white:#ffffff;
  --accent:#4A6741;
  --accent-light:#dce6d8;
  --accent-border:#b3c5ab;
  --g50:#faf9f8;--g100:#f3f1ef;--g200:#E0DCDA;--g300:#ccc8c5;--g400:#a39e9b;--g500:#706b68;--g600:#58534f;--g700:#48433f;
  --radius:8px;--radius-sm:6px;
  --sh-sm:0 1px 3px rgba(50,48,47,.06),0 1px 2px rgba(50,48,47,.04);
  --sh:0 4px 16px rgba(50,48,47,.07),0 2px 6px rgba(50,48,47,.04);
  --sh-lg:0 16px 48px rgba(50,48,47,.1),0 4px 12px rgba(50,48,47,.05);
  --heading:'Lora','Georgia',serif;
  --body:'DM Sans','system-ui','Helvetica Neue',sans-serif;
  --mono:'DM Mono','Consolas',monospace;
}

/* ── Layout ── */
.w{max-width:1100px;margin:0 auto;padding:0 28px}

/* ── Floating Nav Bar ── */
@keyframes fbSlideIn{from{opacity:0;transform:translate(-50%,-20px)}to{opacity:1;transform:translate(-50%,0)}}
.float-bar{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:200;display:flex;align-items:center;max-width:1060px;width:calc(100% - 56px);background:var(--white);padding:8px 8px 8px 22px;border-radius:var(--radius);box-shadow:0 2px 20px rgba(50,48,47,.08),0 0 0 1px rgba(50,48,47,.04);animation:fbSlideIn .6s cubic-bezier(.34,1.56,.64,1) both;transition:box-shadow .3s ease,padding .3s ease}
.float-bar.scrolled{box-shadow:0 4px 28px rgba(50,48,47,.12),0 0 0 1px rgba(50,48,47,.06)}
.fb-logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--black);flex-shrink:0;transition:opacity .2s ease}
.fb-logo:hover{opacity:.7}
.lm{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--accent)}
.ln{font-family:var(--heading);font-size:15px;font-weight:600;letter-spacing:-.02em}
.fb-links{display:flex;align-items:center;gap:2px;margin:0 auto}
.fb-link{font-family:var(--body);font-size:13px;font-weight:400;color:var(--g500);text-decoration:none;padding:8px 16px;border-radius:var(--radius-sm);transition:color .2s ease,background .2s ease;white-space:nowrap}
.fb-link:hover{color:var(--black);background:var(--g50)}
.fb-link.active{color:var(--accent);background:var(--accent-light);font-weight:500}
.fb-cta{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#fff;padding:10px 24px;border-radius:var(--radius);font-family:var(--body);font-size:13px;font-weight:500;text-decoration:none;white-space:nowrap;flex-shrink:0;transition:transform .25s ease,box-shadow .25s ease;box-shadow:0 2px 8px rgba(74,103,65,.15)}
.fb-cta:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(74,103,65,.25)}

/* Hamburger */
.fb-hamburger{display:none;flex-direction:column;justify-content:center;gap:5px;width:36px;height:36px;padding:6px;cursor:pointer;background:none;border:none;flex-shrink:0}
.fb-hamburger span{display:block;width:100%;height:2px;background:var(--black);border-radius:2px;transition:transform .3s ease,opacity .3s ease}
.fb-hamburger.open span:first-child{transform:translateY(3.5px) rotate(45deg)}
.fb-hamburger.open span:nth-child(2){opacity:0}
.fb-hamburger.open span:last-child{transform:translateY(-3.5px) rotate(-45deg)}

/* ── Blog Hero ── */
.blog-hero{padding:140px 0 48px;text-align:center}
.blog-hero h1{font-family:var(--heading);font-size:clamp(32px,5vw,48px);font-weight:600;letter-spacing:-.02em;margin-bottom:12px}
.blog-hero p{font-size:17px;color:var(--g500);max-width:540px;margin:0 auto}

/* ── Blog Grid ── */
.blog-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:28px;padding-bottom:80px}

.blog-card{display:flex;flex-direction:column;border-radius:var(--radius);overflow:hidden;background:var(--white);box-shadow:var(--sh-sm);border:1px solid var(--g200);transition:transform .25s ease,box-shadow .25s ease;text-decoration:none;color:inherit}
.blog-card:hover{transform:translateY(-4px);box-shadow:var(--sh)}

.blog-card-img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}

.blog-card-body{padding:20px 22px 24px;display:flex;flex-direction:column;flex:1}
.blog-card-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.blog-card-tag{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--accent);background:var(--accent-light);padding:3px 10px;border-radius:20px}
.blog-card-title{font-family:var(--heading);font-size:19px;font-weight:600;letter-spacing:-.01em;line-height:1.35;margin-bottom:8px}
.blog-card-excerpt{font-size:14px;color:var(--g500);line-height:1.6;margin-bottom:16px;flex:1}
.blog-card-meta{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--g400);font-family:var(--mono)}

/* ── Empty State ── */
.blog-empty{text-align:center;padding:80px 0;color:var(--g400);font-size:15px}

/* Footer styles loaded by /shared/footer.js */

/* ── Responsive ── */
@media(max-width:768px){
  .float-bar{width:calc(100% - 32px);padding:6px 6px 6px 16px}
  .fb-links{display:none;position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--white);flex-direction:column;padding:12px;border-radius:var(--radius);box-shadow:var(--sh-lg);gap:2px}
  .fb-links.open{display:flex}
  .fb-hamburger{display:flex}
  .blog-hero{padding:110px 0 36px}
  .blog-grid{grid-template-columns:1fr}
}
</style>
</head>

<div id="site-footer"></div>

<!-- ── Load posts and render grid ── -->
<script src="/blog/posts.js"></script>
<script>
(function() {
  var grid = document.getElementById('blog-grid');
  var empty = document.getElementById('blog-empty');
  var posts = typeof BLOG_POSTS !== 'undefined' ? BLOG_POSTS : [];

  if (!posts.length) {
    empty.style.display = 'block';
    return;
  }

  posts.forEach(function(post) {
    var d = new Date(post.date + 'T00:00:00');
    var dateStr = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

    var card = document.createElement('a');
    card.href = '/blog/' + post.slug;
    card.className = 'blog-card';

    var tagsHtml = (post.tags || []).map(function(t) {
      return '<span class="blog-card-tag">' + t + '</span>';
    }).join('');

    card.innerHTML =
      '<img class="blog-card-img" src="' + post.image + '" alt="' + post.title.replace(/"/g, '&quot;') + '" loading="lazy">' +
      '<div class="blog-card-body">' +
        '<div class="blog-card-tags">' + tagsHtml + '</div>' +
        '<h2 class="blog-card-title">' + post.title + '</h2>' +
        '<p class="blog-card-excerpt">' + post.excerpt + '</p>' +
        '<div class="blog-card-meta">' +
          '<span>' + (post.author || 'RevWhisper Team') + '</span>' +
          '<span>' + dateStr + '</span>' +
        '</div>' +
      '</div>';

    grid.appendChild(card);
  });
})();
</script>

<!-- ── Nav scroll & hamburger ── -->
<script>
(function() {
  var floatBar = document.getElementById('float-bar');
  if (floatBar) {
    window.addEventListener('scroll', function() {
      floatBar.classList.toggle('scrolled', window.pageYOffset > 60);
    }, { passive: true });
  }
  var hamburger = document.getElementById('fb-hamburger');
  var fbLinks = document.getElementById('fb-links');
  if (hamburger && fbLinks) {
    hamburger.addEventListener('click', function() {
      var isOpen = fbLinks.classList.toggle('open');
      hamburger.classList.toggle('open');
      hamburger.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    });
  }
})();
</script>
<script defer src="/_vercel/insights/script.js"></script>
